spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecart}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# JWT_SECRET accepts Base64 for 32+ bytes or plain text of 32+ UTF-8 bytes.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
admin.bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN:}

cart.reservation.expiration-minutes=30